[project]
name = "job-search-robot"
version = "0.1.0"
description = "Find never-seen job leads on hiring platforms via Google (SerpApi) into an Excel workbook"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "openpyxl>=3.1.5",
    "pyyaml>=6.0.3",
]

[project.scripts]
job-search-robot = "job_search_robot:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
