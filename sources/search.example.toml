# EXAMPLE search settings. Copy it to search.toml (private, git-ignored) and edit the copy:
#   Windows:      Copy-Item sources\search.example.toml sources\search.toml
#   macOS/Linux:  cp sources/search.example.toml sources/search.toml
# The tool reads search.toml on every run. Run `uv run job-search-robot preview` after editing.

[budget]
monthly_limit = 250      # SerpApi free plan: 250 searches/month. For more, see "Need more searches?" in the README
per_run = 16             # each run spends up to this many: ~15 runs/month (every 2 days) x 16 = 240
pages_per_query = 1      # single-platform queries return few results; 1 page is enough
max_query_words = 20     # longer queries make Google drop site: (measured: 14 words kept, 32 dropped)
revisit_days = [2, 4, 8] # when a query is due, by family priority 1, 2, 3 (days); most overdue go first
per_hour = 50            # SerpApi free plan throughput: 50 searches per hour
allow_paid_plan = false  # false: run and sweep stop before searching on a priced SerpApi plan or bought Serper credits

[google]
source = "serpapi"       # search service when a command has no --source: "serpapi" or "serper" (README: "Serper as a backup")
country = "il"
language = "en"
freshness = "any"        # "any" = no date filter (recommended); or "day", "week", "month".
                         # With a "month" filter, Google ignored site: in 20 of 20 test searches and
                         # showed general pages; the same kind of search without a filter found jobs.
timeout_seconds = 30

# Terms OR-ed into every query. Each word costs query length, and "Israel" already
# matches every region, so keep this short. Cities here only catch pages that
# don't say "Israel".
[location]
query_terms = ["Israel", "Tel Aviv"]

# Regions do NOT change the query. They tag each lead from its location, title or snippet:
# a city in an enabled region -> that region; in a disabled region -> "outside area".
# Spelling variants help matching (Ra'anana / Raanana).
[[region]]
name = "Central"
enabled = true
cities = ["Tel Aviv", "Tel-Aviv", "Ramat Gan", "Givatayim", "Herzliya", "Herzlia", "Petah Tikva",
          "Petach Tikva", "Petah Tiqva", "Bnei Brak", "Holon", "Bat Yam", "Or Yehuda", "Airport City",
          "Yehud", "Rishon LeZion", "Rishon Lezion", "Kiryat Ono", "Qiryat Ono", "Kiriat Ono",
          "Ramat HaSharon", "Ramat Ha-Sharon", "Givat Shmuel", "Giv'at Shmuel", "Ganei Tikva", "Ganey Tikva",
          "Azor", "Savyon", "Kfar Shmaryahu", "Kfar Shemaryahu"]

[[region]]
name = "Sharon"
enabled = true
cities = ["Raanana", "Ra'anana", "Kfar Saba", "Hod Hasharon", "Netanya", "Rosh HaAyin", "Rosh Ha'ayin",
          "Kfar Yona", "Even Yehuda"]

[[region]]
name = "North"
enabled = true
cities = ["Haifa", "Yokneam", "Yoqneam", "Caesarea", "Nazareth", "Migdal HaEmek", "Matam",
          "Tirat HaCarmel", "Tirat Ha-Carmel", "Tirat Carmel", "Hadera", "Or Akiva", "Or Aqiva",
          "Zichron Yaakov", "Zikhron Yaakov", "Zichron Ya'akov", "Zikhron Ya'akov", "Binyamina",
          "Pardes Hanna", "Pardes Hana", "Karkur"]

[[region]]
name = "Jerusalem"
enabled = false
cities = ["Jerusalem", "Beit Shemesh", "Mevaseret"]

[[region]]
name = "South-central"
enabled = false
cities = ["Rehovot", "Ness Ziona", "Nes Ziona", "Modiin", "Modi'in", "Lod", "Ramla", "Kiryat Gat"]

[[region]]
name = "South"
enabled = false
cities = ["Beer Sheva", "Be'er Sheva", "Beersheba", "Ashdod", "Ashkelon"]

# Hiring platforms. Each query searches ONE platform (Google ignores site: OR site:),
# so more platforms = more queries (each adds one query per title group). The tool knows the job
# IDs of the first seven and checks their jobs (Workday: from the address only); the ones after
# Workday are untested.
[[platform]]
name = "Comeet"
site = "comeet.com/jobs"
enabled = true

[[platform]]
name = "Greenhouse"
site = "greenhouse.io"
enabled = true

[[platform]]
name = "Lever"
site = "jobs.lever.co"
enabled = false          # supported; off because tests found no Israeli management jobs here

[[platform]]
name = "Ashby"
site = "jobs.ashbyhq.com"
enabled = true

[[platform]]
name = "Workable"
site = "apply.workable.com"
enabled = false          # supported; off because few Israeli jobs were found and its pages can't be read

[[platform]]
name = "SmartRecruiters"
site = "jobs.smartrecruiters.com"
enabled = true           # location, work mode and posting date come from the job page

[[platform]]
name = "Workday"
site = "myworkdayjobs.com"
enabled = true           # Workday refuses page requests: the location comes from the job address;
                         # open/closed and the posting date stay unknown

[[platform]]
name = "BambooHR"
site = "bamboohr.com/careers"
enabled = false

[[platform]]
name = "Breezy"
site = "breezy.hr"
enabled = false

[[platform]]
name = "Recruitee"
site = "recruitee.com"
enabled = false

[[platform]]
name = "Teamtailor"
site = "teamtailor.com"
enabled = false

[filters]
# Phrases excluded from every query (-"phrase"). Keep it conservative: broad words
# like "sales" or "support" also appear on relevant pages.
exclude_terms = []

# Leads whose TITLE contains one of these phrases are not shown in the workbook
# (whole words, any case). Free: the search itself is unchanged. Example: no sales
# and no hardware roles. Run `refresh` after editing to apply it to existing leads.
title_exclude = [
  # sales
  "Sales", "Presales", "Pre-Sales", "Business Development", "Account Executive", "Account Manager",
  # hardware
  "Hardware", "HW", "Silicon", "ASIC", "FPGA", "VLSI", "Chip", "Analog", "RF", "PCB",
  "Board Design", "Mechanical", "Electrical",
]

# Company careers pages (a list of jobs, not one job). true = shown, except when the
# company already has a job lead shown. false = always hidden.
show_career_pages = true

# The Posted cell is shaded when the job was posted more than this many days ago (still shown).
old_posting_days = 60

# Jobs whose page date is more than this many days ago are hidden (0 = never). Free:
# run `refresh` after a change. Jobs without a date and jobs you have marked stay shown.
hide_older_than_days = 30
