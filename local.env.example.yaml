# Template for local values. Copy it to local.env.yaml (git-ignored) and edit the copy:
#   Windows:      Copy-Item local.env.example.yaml local.env.yaml
#   macOS/Linux:  cp local.env.example.yaml local.env.yaml
# Never commit local.env.yaml and never paste the key into any other file.
# A real SERPAPI_API_KEY environment variable wins over this file.

# Your SerpApi key: https://serpapi.com/manage-api-key (free plan: 250 searches/month)
SERPAPI_API_KEY: "paste-your-key-here"

# Optional. Remove the # to use a line.
# Serper: a backup search source (`run --source serper`); `account` shows its credits.
# SERPER_API_KEY: "paste-your-key-here"
# Tavily: not used for searching; `account` only shows its credits.
# TAVILY_API_KEY: "paste-your-key-here"
